plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                cyberclasses {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

// Photon files are exported at build time, never requiring Photon or LDLib
// to load CyberClasses when the optional visual mod is absent.
sourceSets {
    fxgen {
        java.srcDir 'fxgen/src/main/java'
        resources.srcDirs = []
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

repositories {
    maven {
        name = 'LowDragLibSnapshots'
        url = 'https://maven.firstdarkdev.xyz/snapshots'
        content { includeGroup 'com.lowdragmc.ldlib' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional compile target only. CyberClasses remains functional without
    // Iron's Spells, but when it is present SpellPreCastEvent is used to make
    // magic restrictions impossible to bypass through the spell wheel.
    compileOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:8364933")

    // Dedicated Photon .fx export, used ONLY by fxgen at build time.
    fxgenImplementation fg.deobf("curse.maven:photon-871522:7501597@jar")
    fxgenImplementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.42@jar")
}

tasks.register('generateClassTransformationFx', JavaExec) {
    dependsOn tasks.named('fxgenClasses')
    classpath = sourceSets.fxgen.runtimeClasspath
    mainClass = 'com.cyberspectraa.cyberclasses.fxgen.ClassTransformationFxGenerator'
    args layout.buildDirectory.file('generated-class-fx/assets/cyberclasses/fx/class_transformation.fx')
            .get().asFile.absolutePath
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateClassTransformationFx')
    from(layout.buildDirectory.dir('generated-class-fx'))

    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
